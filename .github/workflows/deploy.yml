name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build (base = /LaTanadelGatto/)
        run: npx vite build --base=/LaTanadelGatto/

      - name: SPA fallback (404.html -> redirect to index)
        shell: bash
        run: |
          cat > dist/404.html <<'HTML'
          <!doctype html>
          <html lang="it">
            <head>
              <meta charset="UTF-8" />
              <title>La Tana del Gatto</title>
              <script>
                // GitHub Pages serves 404.html for unknown paths.
                // Redirect to the SPA index keeping the requested path,
                // so react-router can pick it up.
                var basePath = '/LaTanadelGatto/';
                var path = window.location.pathname;
                var rel = path.indexOf(basePath) === 0 ? path.slice(basePath.length) : path.replace(/^\//, '');
                var target = basePath + (rel ? '#' + rel : '');
                window.location.replace(target);
              </script>
            </head>
            <body></body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4